name: Build & Push Worker to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.worker'
      - 'scripts/worker.ts'
      - 'src/lib/queues/**'
      - 'src/actions/objections.ts'
      - 'src/actions/whop.ts'
      - 'src/lib/email/**'
      - 'src/lib/redis*'
      - 'prisma/schema.prisma'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

# Required permissions for AWS OIDC authentication (id-token: write)
permissions:
  id-token: write
  contents: read

env:
  # CHANGE THIS IF YOUR ECR REPOSITORY HAS A DIFFERENT NAME:
  ECR_REPOSITORY: voxinar-worker
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-VoxinarWorkerBuild
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract git short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push worker Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
          # GitHub Actions layer caching keeps repeat builds fast
          cache-from: type=gha
          cache-to: type=gha,mode=max
