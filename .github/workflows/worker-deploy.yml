name: Build & Push Worker to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.worker'
      - 'scripts/worker.ts'
      - 'src/lib/queues/**'
      - 'src/actions/objections.ts'
      - 'src/actions/whop.ts'
      - 'src/lib/email/**'
      - 'src/lib/redis*'
      - 'prisma/schema.prisma'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: voxinar-worker
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-VoxinarWorkerBuild
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract git short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push worker Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-VoxinarWorkerDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send-command
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SHA_SHORT="${{ needs.build-and-push.outputs.sha_short }}"
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:$SHA_SHORT"

          echo "Resolved account: $ACCOUNT_ID"
          echo "Resolved registry: $REGISTRY"
          echo "Resolved sha_short: $SHA_SHORT"
          echo "Image to deploy: $IMAGE"

          COMMANDS=$(cat <<JSON
          {
            "commands": [
              "echo === docker login ===",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY",
              "echo === docker pull ===",
              "docker pull $IMAGE",
              "echo === stopping old container if any ===",
              "docker stop -t 30 voxinar-worker 2>&1 || echo no existing container to stop",
              "docker rm voxinar-worker 2>&1 || echo no existing container to remove",
              "echo === starting new container ===",
              "docker run -d --restart unless-stopped --env-file /home/ubuntu/worker.env --name voxinar-worker $IMAGE",
              "echo === waiting 15s ===",
              "sleep 15",
              "echo === container status ===",
              "docker ps -a --filter name=voxinar-worker",
              "echo === recent container logs ===",
              "docker logs --tail 50 voxinar-worker 2>&1 || echo no logs available",
              "echo === final running check ===",
              "docker ps --filter name=voxinar-worker --filter status=running --format '{{.Names}}' | grep -q voxinar-worker"
            ]
          }
          JSON
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy voxinar-worker $SHA_SHORT" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait for SSM command to finish
        id: wait-command
        run: |
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          STATUS="Pending"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 5
          done

          echo "final_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Print deploy command output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

      - name: Fail job if deploy did not succeed
        if: steps.wait-command.outputs.final_status != 'Success'
        run: |
          echo "Deploy failed or timed out - status: ${{ steps.wait-command.outputs.final_status }}"
          exit 1